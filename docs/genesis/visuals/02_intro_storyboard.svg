/><rect x="630" y="275" width="190" height="105" fill="#152b37" stroke="#66a6b9" stroke-width="7"/><circle cx="905" cy="317" r="26" fill="#eac27b"/><path d="M905 347 v33" stroke="#eac27b" stroke-width="14"/><text x="610" y="410" class="tag">04 · ESCÓNDETE</text></g><text x="50" y="654" class="small">Las figuras son guías de cámara y ritmo. Claude debe construir escenas 3D jugables.</text></svg>
